# Déploiement Coolify (ressource « Docker Compose », chemin du fichier : /compose.prod.yaml).
# Un conteneur par service : mongodb, api (HTTP), worker (préchauffage du cache).
# Aucun port publié : Coolify (Traefik) route le domaine de l'API vers api:3001.
# Variables à renseigner dans Coolify : voir docs/DEPLOY.md.
# Pas de `${VAR:?}` : Coolify v3 lance `docker compose pull` sans les secrets. Une variable
# obligatoire manquante est refusée au démarrage par la validation de l'API (src/config/env.ts).
services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    expose:
      - '3001'
    environment:
      NODE_ENV: production
      PORT: '3001'
      MONGODB_URI: mongodb://mongodb:27017/thebaroness
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      FRONT_URL: ${FRONT_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-60}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-300}
      DEADLOCK_API_BASE_URL: ${DEADLOCK_API_BASE_URL:-https://api.deadlock-api.com}
      DEADLOCK_API_KEY: ${DEADLOCK_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Le préchauffage tourne dans le conteneur worker, pas dans l'API.
      REFRESH_WORKER_ENABLED: 'false'
    depends_on:
      mongodb:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/thebaroness
      # Exigé par la validation commune de la configuration (non utilisé par le worker).
      JWT_SECRET: ${JWT_SECRET}
      DEADLOCK_API_BASE_URL: ${DEADLOCK_API_BASE_URL:-https://api.deadlock-api.com}
      DEADLOCK_API_KEY: ${DEADLOCK_API_KEY:-}
      REFRESH_INTERVAL_MS: ${REFRESH_INTERVAL_MS:-300000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Sain si un cycle s'est terminé récemment (heartbeat réécrit à chaque cycle).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('fs').statSync('/tmp/thebaroness-worker.heartbeat');process.exit(Date.now()-s.mtimeMs<2*Number(process.env.REFRESH_INTERVAL_MS||300000)+120000?0:1)"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
