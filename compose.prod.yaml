# Déploiement Coolify (ressource « Docker Compose », chemin du fichier : /compose.prod.yaml).
# Un conteneur par service : mongodb, api (HTTP), worker (préchauffage du cache).
# Aucun port publié : Coolify (Traefik) route le domaine de l'API vers api:3001.
# Variables à renseigner dans Coolify : voir docs/DEPLOY.md.
# Coolify v3 injecte lui-même les Secrets dans l'environnement de chaque service : seules les
# valeurs propres au réseau Docker figurent ici (une même clé en double fait échouer le pull).
# Variables absentes : défauts de src/config/env.ts ; obligatoire manquante : refus au démarrage.
services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    expose:
      - '3001'
    environment:
      NODE_ENV: production
      PORT: '3001'
      MONGODB_URI: mongodb://mongodb:27017/thebaroness
      # Le préchauffage tourne dans le conteneur worker, pas dans l'API.
      REFRESH_WORKER_ENABLED: 'false'
    depends_on:
      mongodb:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/thebaroness
    # Sain si un cycle s'est terminé récemment (heartbeat réécrit à chaque cycle).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('fs').statSync('/tmp/thebaroness-worker.heartbeat');process.exit(Date.now()-s.mtimeMs<2*Number(process.env.REFRESH_INTERVAL_MS||300000)+120000?0:1)"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
